<style>
:root{
  --bg:#E2E6E2; --panel:#FFFFFF; --panel2:#F4F6F3; --line:#D2D8D3; --text:#151A17; --muted:#5A645E;
  --brand:#C8FF3D; --brand-ink:#0A0C0B; --brand-soft:#F0FBD6; --brand-line:#7DAA12; --focus:#3F6B00;
  --warn:#8A5300; --warn-soft:#FFF3DC; --err:#B42318; --err-soft:#FDE8E6; --ok:#1E7A3C; --ok-soft:#E3F4E8;
  --shadow:0 1px 2px rgba(10,12,11,.18),0 6px 18px rgba(10,12,11,.10);
  --ink-bar:#0A0C0B; --ink-bar-text:#F2F4F1; --ink-bar-muted:#C9D0CC; --ink-bar-line:#2C3430;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#1A1F1C; --panel:#0F1211; --panel2:#171B19; --line:#2C3430; --text:#F2F4F1; --muted:#9FA9A3;
  --brand-soft:#243014; --brand-line:#C8FF3D; --focus:#C8FF3D;
  --warn:#F2B35A; --warn-soft:#3A2F1C; --err:#FF8A80; --err-soft:#3D2222; --ok:#7ED39A; --ok-soft:#1E3326;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.35); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#1A1F1C; --panel:#0F1211; --panel2:#171B19; --line:#2C3430; --text:#F2F4F1; --muted:#9FA9A3;
  --brand-soft:#243014; --brand-line:#C8FF3D; --focus:#C8FF3D;
  --warn:#F2B35A; --warn-soft:#3A2F1C; --err:#FF8A80; --err-soft:#3D2222; --ok:#7ED39A; --ok-soft:#1E3326; color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink-bar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--ink-bar);color:var(--ink-bar-text);border-bottom:1px solid var(--ink-bar-line);min-width:0}
.top .btn{background:transparent;color:var(--ink-bar-text);border-color:#3A4440}
.top .btn:hover{background:#1A1F1C}
.top .btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.top .btn.pri:hover{background:#D7FF6E}
.top :focus-visible{outline-color:var(--brand)}
.mark{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.mark b{font-family:Archivo,"Arial Black",sans-serif;font-weight:800;letter-spacing:.18em;font-size:17px}
.mark img{align-self:center;display:block}
.mark{align-items:center}
.mark span{color:var(--ink-bar-muted);font-size:12px}
.ptitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-bar-muted);font-size:13px}
.meter{display:flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap;color:var(--ink-bar-muted)}
.meter .bar{width:90px;height:6px;border-radius:3px;background:#1A1F1C;border:1px solid var(--ink-bar-line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--brand)}
.meter.over .bar i{background:#FF4D4F}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 11px;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.5;cursor:default}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);min-width:260px;z-index:40;padding:4px;display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px}
.menu button:hover{background:var(--panel2)}
.menu small{display:block;color:var(--muted);font-size:11px}
/* main */
.main{display:grid;grid-template-columns:270px 1fr 380px;min-height:0}
.side,.edit{background:var(--panel);overflow:auto;min-height:0}
.side{border-right:1px solid var(--line)}
.edit{border-left:1px solid var(--line)}
.sec{padding:10px 12px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:700}
.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:6px;padding:6px 8px;min-width:0}
.item:hover{background:var(--panel2)}
.item.sel{background:var(--brand-soft);border-color:var(--brand-line)}
.item .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .pp{font-size:11px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok)}
.dot.warn{background:#E0A100}.dot.err{background:var(--err)}.dot.none{background:var(--line)}
.kind{font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted);flex:none;min-width:34px;text-align:center}
.issues{font-size:12px}
.issues button{display:block;width:100%;text-align:left;border:0;background:none;padding:4px 2px;color:inherit}
.issues .e{color:var(--err)}.issues .w{color:var(--warn)}
/* stage */
.center{display:grid;grid-template-rows:auto 1fr;min-height:0;min-width:0}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:4px 10px;font-size:12px}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.paste{overflow:auto;padding:24px;min-height:0}
.pages{display:flex;flex-wrap:wrap;gap:22px 18px;justify-content:center;align-items:flex-start}
.pages.spread{display:grid;grid-template-columns:repeat(2,max-content);gap:22px 0;justify-content:center}
.pwrap{position:relative;cursor:pointer}
.pwrap .lab{font-size:11px;color:var(--muted);margin-top:4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwrap .scaler{box-shadow:var(--shadow);overflow:hidden;background:#fff}
.pwrap.sel .scaler{outline:2px solid var(--brand-line);outline-offset:3px}
.pwrap .scaler>.pg{transform-origin:0 0}
.empty{max-width:520px;margin:60px auto;text-align:center;color:var(--muted)}
/* editor */
.fld{display:block;margin:0 0 10px}
.fld>span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea,.inp{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:6px 8px}
.fld textarea{min-height:120px;resize:vertical;font-family:"BIZ UDPGothic",monospace;font-size:13px;line-height:1.55}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.fld{flex:1;min-width:110px}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;margin:0 0 8px}
.help{font-size:12px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:0 0 10px;line-height:1.6}
.help code{font-size:11.5px}
.edit h2{font-size:16px;margin:0 0 4px}
.edit .sub{font-size:12px;color:var(--muted);margin:0 0 12px}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:10px;text-align:center;font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;justify-content:center;min-height:64px}
.drop.on{border-color:var(--brand-line);background:var(--brand-soft)}
.thumb{width:56px;height:56px;border:1px solid var(--line);border-radius:6px;background:#fff center/contain no-repeat;flex:none}
.thumb.wide{width:96px}
.tlist{border:1px solid var(--line);border-radius:6px;max-height:300px;overflow:auto}
.tlist button{display:flex;gap:8px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:var(--panel);padding:6px 8px;text-align:left}
.tlist button:last-child{border-bottom:0}
.tlist button:hover{background:var(--panel2)}
.tlist .lg{width:26px;height:26px;border-radius:4px;border:1px solid var(--line);background:#fff center/contain no-repeat;flex:none}
.tlist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlist .meta{font-size:11px;color:var(--muted)}
table.ptab{width:100%;border-collapse:collapse;font-size:12px}
table.ptab th{font-weight:400;color:var(--muted);text-align:left;padding:2px}
table.ptab td{padding:1px}
table.ptab input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:4px;padding:3px 5px;background:var(--panel)}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;margin:0 0 10px;background:var(--panel2)}
.themecards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.themecards button{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:8px;text-align:left}
.themecards button.on{border-color:var(--brand-line);box-shadow:0 0 0 1px var(--brand-line)}
.themecards .sw{display:flex;gap:3px;margin-top:6px}.themecards .sw i{width:16px;height:16px;border-radius:3px;border:1px solid rgba(0,0,0,.15)}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.colors label{display:flex;align-items:center;gap:6px;font-size:12px}
.colors input{width:34px;height:26px;border:1px solid var(--line);border-radius:4px;padding:0;background:none}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,20,30,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.open{display:flex}
.dlg{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);max-width:640px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:20px}
.dlg h2{margin:0 0 4px;font-size:18px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.prog{height:8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;width:0;background:var(--brand);transition:width .2s}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink-bar);color:var(--ink-bar-text);border-left:4px solid var(--brand);padding:9px 16px;border-radius:8px;font-size:13px;z-index:80;display:none;max-width:90%}
.toast.open{display:block}
.mtabs{display:none}
#stage{position:fixed;left:-20000px;top:0;pointer-events:none}
/* cloud */
.sync{font-size:12px;white-space:nowrap;margin-left:auto;border:1px solid var(--ink-bar-line);border-radius:999px;padding:3px 10px;color:var(--ink-bar-muted);background:none;cursor:pointer}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:#7E8883;vertical-align:1px}
.sync.saved::before{background:var(--brand)}
.sync.saving::before,.sync.pending::before{background:#E0A100}
.sync.offline::before,.sync.error::before,.sync.login::before{background:#FF4D4F}
.home{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;display:none;padding-bottom:env(safe-area-inset-bottom,0px)}
.home.open{display:block}
.home-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--ink-bar);color:var(--ink-bar-text)}
.home-bar .who{margin-left:auto;font-size:12px;color:var(--ink-bar-muted)}
.home-bar .btn{background:transparent;color:var(--ink-bar-text);border-color:#3A4440}
.home-in{max-width:900px;margin:0 auto;padding:22px 16px 40px}
.home h1{font-size:22px;margin:0 0 4px}
.home .lead{color:var(--muted);font-size:13px;margin:0 0 16px}
.home .acts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.home .acts .btn{padding:9px 14px}
.home .acts .btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.plist{display:grid;gap:10px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pcard .tt{flex:1;min-width:200px}
.pcard .tt b{display:block;font-size:15px;line-height:1.4;cursor:pointer}
.pcard .tt small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.pcard .bt{display:flex;gap:6px}
.banner{background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner span{flex:1;min-width:200px}
#printRoot{display:none}
@media (max-width:1100px){ .main{grid-template-columns:240px 1fr 330px} }
@media (max-width:860px){
  .main{grid-template-columns:1fr;grid-template-rows:1fr}
  .main>.side,.main>.center,.main>.edit{display:none;border:0}
  .main[data-tab="side"]>.side,.main[data-tab="center"]>.center,.main[data-tab="edit"]>.edit{display:grid}
  .main[data-tab="side"]>.side,.main[data-tab="edit"]>.edit{display:block}
  .app{grid-template-rows:auto 1fr auto}
  .mtabs{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px)}
  .mtabs button{flex:1;border:0;background:none;padding:10px 0;font-size:13px;color:var(--muted)}
  .mtabs button.on{color:var(--text);font-weight:700;box-shadow:inset 0 3px 0 var(--brand)}
  .mark span,.meter,.ptitle,#btnSave{display:none}
  .top{gap:6px;padding:6px 8px;flex-wrap:nowrap}
  .top .btn{padding:5px 9px;font-size:13px}
  .top .mark b{display:none}
  .sync{min-width:0;overflow:hidden;text-overflow:ellipsis;flex:1;padding:3px 8px}
  .menu{right:-60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== booklet page styles (print) ===== */
.pg{position:relative;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--bf),"Noto Sans JP",sans-serif;font-size:var(--fs0);line-height:1.6;box-sizing:border-box;-webkit-font-smoothing:antialiased}
.pg *{box-sizing:border-box}
.pg .bleedlayer{position:absolute;inset:0}
.pg .trim{position:absolute;left:var(--b);top:var(--b);width:var(--w);height:var(--h)}
.pg .body{position:absolute;left:var(--ml);right:var(--mr);top:var(--mt);bottom:var(--mb);overflow:hidden;display:flex;flex-direction:column}
.pg .body>*{flex:none}
.pg .body>.fill{flex:1;min-height:0}
.pg .img{background-position:center;background-repeat:no-repeat;background-size:cover}
.pg .img.contain{background-size:contain}
.pg h1,.pg h2,.pg h3,.pg p{margin:0}
.pg .folio{position:absolute;bottom:7mm;font-size:9pt;font-family:var(--hf),serif}
.pg .rh{position:absolute;top:7mm;left:var(--ml);right:var(--mr);font-size:7pt;display:flex;justify-content:space-between;gap:4mm}
.pg .ui-hint{position:absolute;inset:auto 6mm 6mm 6mm;border:1.5px dashed #1F4BD8;color:#1F4BD8;background:rgba(255,255,255,.88);font:9pt/1.4 "BIZ UDPGothic",sans-serif;padding:3mm;text-align:center;border-radius:2mm}
/* blocks */
.pg .blk{margin:0 0 3.2mm}
.pg .md h2{font-family:var(--hf),serif;font-size:calc(var(--fs0) * 1.3);margin:2mm 0 1.5mm}
.pg .md h3{font-size:calc(var(--fs0) * 1.1);margin:1.5mm 0 1mm}
.pg .md p{text-align:justify}
.pg .md ul,.pg .md ol{margin:0;padding-left:5mm}
.pg .md .kv{display:grid;grid-template-columns:24mm 1fr;gap:0 3mm}
.pg .md .kv dt{font-weight:700}
.pg .md .kv dd{margin:0}
.pg .md .kv dt,.pg .md .kv dd{padding:1mm 0;border-bottom:.2mm solid var(--soft)}
.pg .md-img .im{width:100%;background:center/contain no-repeat}
.pg .md-img .cp{text-align:center;font-size:calc(var(--fs0) * .9);margin-top:1mm}
.pg .brk{display:flex;flex-direction:column}
.pg .brk .svgbox{flex:1;min-height:0}
.pg .brk .bnote{flex:none;font-size:calc(var(--fs0) * .9);margin-top:2mm}
.pg .cover-fb .lg{width:46mm;height:46mm;background:center/contain no-repeat;margin:0 auto 8mm}
.pg .cover-fb .ct{font-size:11pt;margin-top:3mm}
.pg table.t{width:100%;border-collapse:collapse;font-size:calc(var(--fs0) * .98)}
.pg table.t th,.pg table.t td{padding:1.1mm 1.6mm;vertical-align:middle}
.pg .cap{font-weight:700;display:flex;justify-content:space-between;gap:3mm;align-items:flex-end;margin-bottom:1.2mm}
.pg .cap small{font-weight:400;font-size:calc(var(--fs0) * .9)}
.pg .notes{font-size:calc(var(--fs0) * .95)}
/* team list */
.pg .tl-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 8mm}
.pg .tl-row{display:grid;grid-template-columns:6mm 1fr auto;gap:2mm;padding:.5mm 0}
.pg .tl-row .c{color:var(--ink);font-size:calc(var(--fs0) * .92)}
/* draw */
.pg .drawgrid{display:grid;grid-template-columns:repeat(var(--dc,4),1fr);gap:4mm}
.pg .grp .gh{font-weight:700;text-align:center;padding:1mm;font-family:var(--hf),serif}
.pg .grp ol{margin:0;padding:0;list-style:none}
.pg .grp li{display:grid;grid-template-columns:5mm 1fr;padding:1mm 1.5mm;font-size:calc(var(--fs0) * .95);min-height:7mm;align-items:center}
/* team cards */
.pg .tgrid{display:grid;gap:4mm}
.pg .tc{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pg .tc-h{display:flex;gap:2.5mm;align-items:center;flex:none}
.pg .tc-logo{flex:none;width:12mm;height:12mm;background:#fff center/contain no-repeat}
.pg .tc-name{flex:1;min-width:0}
.pg .tc-name b{display:block;font-family:var(--hf),sans-serif;font-size:calc(var(--fs0) * 1.35);line-height:1.25}
.pg .tc-name small{display:block;font-size:calc(var(--fs0) * .85)}
.pg .tc-photo{flex:none;background:#E9ECF1 center/cover no-repeat;margin-top:2mm}
.pg .tc-meta{flex:none;font-size:calc(var(--fs0) * .9);margin-top:1.5mm;display:flex;gap:4mm;flex-wrap:wrap}
.pg .tc-roster{flex:1;min-height:0;overflow:hidden;margin-top:1.5mm;font-size:var(--fs,8pt);display:flex;gap:2mm;align-items:flex-start}
.pg .tc-roster table{flex:1;border-collapse:collapse;font-size:inherit}
.pg .tc-roster th,.pg .tc-roster td{padding:.35em .6em;line-height:1.25}
.pg .tc-roster th{white-space:nowrap;font-size:.85em;padding:.35em .3em}
.pg .tc-roster td.n{text-align:center;width:2.6em;font-weight:700}
.pg .tc-roster td.g{text-align:center;width:2.4em}
.pg .tc-roster td.cp{text-align:center;width:2em}

<script>
'use strict';
/* ========== utilities ========== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));
const norm=s=>String(s??'').normalize('NFKC').toLowerCase().replace(/[\s・･.,\-_()（）「」『』'"’”]/g,'');
const getPath=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const setPath=(o,p,v)=>{const ks=p.split('.');let a=o;ks.slice(0,-1).forEach(k=>{if(a[k]==null)a[k]={};a=a[k];});a[ks[ks.length-1]]=v;};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function toast(msg,ms=2600){const t=$('#toast');t.textContent=msg;t.classList.add('open');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('open'),ms);}

/* ========== storage (IndexedDB) ========== */
const DB={db:null,
  open(){return new Promise((res)=>{try{const r=indexedDB.open('infinex-booklet',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false);}catch(e){res(false)}})},
  get(k){return new Promise(res=>{if(!this.db)return res(null);try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null);}catch(e){res(null)}})},
  set(k,v){return new Promise(res=>{if(!this.db)return res(false);try{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);}catch(e){res(false)}})}
};

/* ========== constants ========== */
const PAPER={A4:{w:210,h:297,label:'A4（210×297mm）'},B5:{w:182,h:257,label:'B5（182×257mm）'},A5:{w:148,h:210,label:'A5（148×210mm）'}};
const FONTS=['Noto Sans JP','Noto Serif JP','Zen Kaku Gothic New','Shippori Mincho','BIZ UDPGothic','BIZ UDPMincho'];
const BUILTIN_THEMES=[
  {id:'official',name:'公式（厳格）',base:'official',builtin:true,desc:'協会配布冊子の定番。明朝見出し、全罫線の表、中央ノンブル。',
   ink:'#000000',accent:'#1B2A5E',accent2:'#7A5C12',soft:'#ECEEF3',rule:'#000000',paper:'#FFFFFF',hf:'Noto Serif JP',bf:'Noto Sans JP',fs:9,mt:18,mb:18,ml:16,mr:16},
  {id:'pro',name:'プロフェッショナル',base:'pro',builtin:true,desc:'マッチデープログラム調。章番号、色帯の表、小口のツメ見出し。',
   ink:'#181B22',accent:'#0042B8',accent2:'#E9A800',soft:'#EEF2F8',rule:'#C7CDD8',paper:'#FFFFFF',hf:'Zen Kaku Gothic New',bf:'Noto Sans JP',fs:9,mt:20,mb:18,ml:15,mr:15}
];
const TYPES={
  cover:{label:'表紙',k:'表紙'}, toc:{label:'目次',k:'目次'}, text:{label:'文章ページ',k:'文章'}, officers:{label:'役員名簿',k:'名簿'},
  teamlist:{label:'出場チーム一覧',k:'一覧'}, teams:{label:'チーム紹介',k:'紹介'}, draw:{label:'組合せ（ブロック）',k:'組合'},
  schedule:{label:'試合日程・審判割当',k:'日程'}, bracket:{label:'トーナメント表',k:'TN'}, sponsors:{label:'スポンサー紹介',k:'協賛'},
  image:{label:'画像ページ（広告・差込）',k:'画像'}, blank:{label:'白紙・メモ',k:'白紙'}, backcover:{label:'裏表紙',k:'裏表'}
};
const NOTOC=['cover','backcover','toc','blank'];

/* ========== state ========== */
const S={p:null,sel:'settings',teamSel:null,scope:'all',spread:false,zoom:.42,pages:[],chapStart:{},issues:[]};

function newChapter(type,title,data={}){

function parseMd(src,images={}){
  // returns array of {html, split?, pbreak?}
  const out=[];const lines=String(src||'').replace(/\r/g,'').split('\n');
  let para=[],list=null,table=null,kv=null;
  const flushP=()=>{if(para.length){out.push({html:`<div class="blk md"><p>${para.map(esc).join('<br>')}</p></div>`});para=[];}};
  const flushL=()=>{if(list){out.push({html:`<div class="blk md"><${list.t}>${list.items.map(i=>`<li>${esc(i)}</li>`).join('')}</${list.t}></div>`});list=null;}};
  const flushT=()=>{if(table){const [hd,...rows]=table;out.push({split:true,html:`<div class="blk md"><table class="t split"><thead><tr>${hd.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${hd.map((_,i)=>`<td>${esc(r[i]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`});table=null;}};
  const flushK=()=>{if(kv){out.push({html:`<div class="blk md"><dl class="kv">${kv.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl></div>`});kv=null;}};
  const flush=()=>{flushP();flushL();flushT();flushK();};
  for(const raw of lines){const l=raw.trimEnd();
    if(/^---+$/.test(l.trim())){flush();out.push({pbreak:true});continue;}
    if(!l.trim()){flush();continue;}
    let m;
    if((m=l.match(/^!\[(.*?)\]\((?:img:)?([^)]+)\)\s*(\d+)?/))){flush();const src=images[m[2]]||'';
      out.push({html:`<div class="blk md-img"><div class="im" style="height:${m[3]||90}mm;${src?`background-image:url('${src}')`:'background:#eee'}"></div>${m[1]?`<div class="cp">${esc(m[1])}</div>`:''}</div>`});continue;}
    if((m=l.match(/^【(.+?)】\s*(.*)$/))){flushP();flushL();flushT();(kv=kv||[]).push([m[1],m[2]]);continue;}
    if((m=l.match(/^#{1,2}\s+(.*)/))){flush();out.push({html:`<div class="blk md keep"><h2>${esc(m[1])}</h2></div>`,keep:true});continue;}
    if((m=l.match(/^###\s+(.*)/))){flush();out.push({html:`<div class="blk md keep"><h3>${esc(m[1])}</h3></div>`,keep:true});continue;}
    if((m=l.match(/^\s*[-・]\s+(.*)/))){flushP();flushT();if(!list||list.t!=='ul'){flushL();list={t:'ul',items:[]};}list.items.push(m[1]);continue;}
    if((m=l.match(/^\s*\d+[.．]\s+(.*)/))){flushP();flushT();if(!list||list.t!=='ol'){flushL();list={t:'ol',items:[]};}list.items.push(m[1]);continue;}
    if(/^\s*\|/.test(l)){flushP();flushL();const cells=l.trim().replace(/^\||\|$/g,'').split('|').map(s=>s.trim());if(cells.every(c=>/^:?-+:?$/.test(c)))continue;(table=table||[]).push(cells);continue;}
    flushL();flushT();flushK();para.push(l);
  }
  flush();return out;
}
function parseOfficers(src){
  const out=[];let rows=[];let head=null;
  const flush=()=>{if(rows.length||head){out.push({split:true,html:`<div class="blk">${head?`<div class="md"><h2>${esc(head)}</h2></div>`:''}<table class="t split off"><colgroup><col style="width:24%"><col style="width:28%"><col></colgroup><tbody>${rows.map(r=>`<tr><td style="font-weight:700">${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>`});}rows=[];head=null;};
  String(src||'').replace(/\r/g,'').split('\n').forEach(l=>{if(!l.trim())return;const m=l.match(/^#{1,3}\s*(.*)/);if(m){flush();head=m[1];return;}
    const c=l.split(/\t|\|/).map(s=>s.trim());rows.push([c[0]||'',c[1]||'',c[2]||'']);});
  flush();return out;
}
function parseSchedule(src){
  const sessions=[];let cur=null;
  String(src||'').replace(/\r/g,'').split('\n').forEach(l=>{if(!l.trim())return;const m=l.match(/^#{1,3}\s*(.*)/);
    if(m){const parts=m[1].split('|').map(s=>s.trim());cur={title:parts[0]||'',date:parts[1]||'',info:parts[2]||'',matches:[]};sessions.push(cur);return;}
    if(!cur){cur={title:'',date:'',info:'',matches:[]};sessions.push(cur);}
    const c=l.split(/,|\t/).map(s=>s.trim());cur.matches.push({order:c[0]||'',time:c[1]||'',home:c[2]||'',away:c[3]||'',ref:c[4]||'',ref2:c[5]||''});});
  return sessions;
}
function parseDraw(teams){
  const map=new Map();teams.forEach(t=>{const g=(t.group||'').trim();if(!g)return;if(!map.has(g))map.set(g,[]);map.get(g).push(t);});
  return [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ja')).map(([name,ts])=>({name,teams:ts}));
}

    if(tb&&tb.rows.length>1){const rest=[];while(over()&&tb.rows.length>1){const r=tb.rows[tb.rows.length-1];rest.unshift(r);r.remove();}
      if(!over()){const c=el.cloneNode(true);const h2=c.querySelector('.md h2');if(h2)h2.remove();c.querySelector('table.split tbody').replaceChildren(...rest);start();q.unshift({el:c,split:true});continue;}
      rest.forEach(r=>tb.append(r));}
    if(count()>1){el.remove();
      // keep heading with next
      const prev=holder.lastElementChild;const carry=[];if(prev&&prev.classList.contains('keep')&&count()>1){prev.remove();carry.push({el:prev});}
      start();q.unshift(...carry,{el,split:b.split});continue;}
    out[out.length-1].overflow=true; // single block too large

}

/* --- bracket SVG --- */
function buildBracket(ch){
  const pg=shellEl();const body=$('.body',pg);const note=(ch.data.note||'').trim();
  body.innerHTML=headHtml(ch)+`<div class="fill brk"><div class="svgbox"></div>${note?`<div class="bnote">${note.split('\n').map(l=>`<div>${esc(l)}</div>`).join('')}</div>`:''}</div>`;
  const box=$('.svgbox',pg);const labs=String(ch.data.labels||'').replace(/\r/g,'').split('\n').map(s=>s.trim());const W=box.clientWidth*25.4/96,H=box.clientHeight*25.4/96;
  let ents=String(ch.data.entries||'').replace(/\r/g,'').split('\n').map(s=>s.trim());while(ents.length&&!ents[ents.length-1])ents.pop();
  const th=theme();
  if(ents.length<2){box.innerHTML='<p>出場チーム（またはブロック順位）を1行に1つずつ入力してください。</p>';return [rec(pg,ch,'bracket')];}
  let slots=2;while(slots<ents.length)slots*=2;while(ents.length<slots)ents.push('');
  const leaves=slots/2,R=Math.log2(leaves);
  const fsz=Math.max(2.2,Math.min(3.6,(H-24)/leaves*.42));
  const nameW=Math.min(42,Math.max(26,W*.2));const top=12,bot=6;const gap=(H-top-bot)/leaves;
  const cx=W/2,stepX=R>0?(cx-nameW-10)/R:0;
  const ink=th.base==='pro'?th.ink:'#000';const ac=th.base==='pro'?th.accent:'#000';
  let s='';let mno=0;const lw=.3;
  const roundName=k=>{const fromEnd=R-k;return fromEnd===0?'準決勝':fromEnd===1?'準々決勝':`${k}回戦`;};
  const side=(arr,dir)=>{// dir 1 left, -1 right
    const x0=dir===1?0:W;let ys=arr.map((_,i)=>top+gap*i+gap/2);
    arr.forEach((t,i)=>{const bx=dir===1?x0:x0-nameW;
      const bh=Math.min(gap*.76,11);s+=`<rect x="${bx}" y="${ys[i]-bh/2}" width="${nameW}" height="${bh}" fill="${th.base==='pro'?th.soft:'#fff'}" stroke="${th.base==='pro'?'none':ink}" stroke-width="${lw}"/>`;
      s+=`<text x="${dir===1?bx+1.5:bx+nameW-1.5}" y="${ys[i]}" font-size="${fsz}" dominant-baseline="central" text-anchor="${dir===1?'start':'end'}" fill="${ink}">${esc(t||'')}</text>`;});
    let x=dir===1?nameW:W-nameW;
    for(let k=1;k<=R;k++){const nx=dir===1?nameW+stepX*k:W-nameW-stepX*k;const ny=[];
      if(dir===1)s+=`<text x="${(x+nx)/2}" y="${top-4}" font-size="${2.6}" text-anchor="middle" fill="${ac}" font-weight="700">${roundName(k)}</text>`;
      else s+=`<text x="${(x+nx)/2}" y="${top-4}" font-size="${2.6}" text-anchor="middle" fill="${ac}" font-weight="700">${roundName(k)}</text>`;
      for(let i=0;i<ys.length;i+=2){const a=ys[i],b=ys[i+1],m=(a+b)/2;
        s+=`<path d="M${x} ${a}H${nx}V${b}H${x}" fill="none" stroke="${ink}" stroke-width="${lw}"/>`;
        if(ch.data.numbers){mno++;const lb=labs[mno-1]||String(mno);s+=`<text x="${nx+(dir===1?-1:1)}" y="${m-1}" font-size="${labs[mno-1]?2.1:2.4}" text-anchor="${dir===1?'end':'start'}" fill="${ac}">${esc(lb)}</text>`;}
        ny.push(m);}
      ys=ny;x=nx;}
    return {x,y:ys[0]};
  };
  const L=side(ents.slice(0,leaves),1),Rr=side(ents.slice(leaves),-1);
  const fy=(L.y+Rr.y)/2;
  s+=`<path d="M${L.x} ${L.y}H${cx}M${Rr.x} ${Rr.y}H${cx}" stroke="${ac}" stroke-width="${lw*2}" fill="none"/>`;
  const cy=Math.max(top+2,fy-Math.min(gap*1.2,40)-14);
  s+=`<path d="M${cx} ${fy}V${cy+8}" stroke="${ac}" stroke-width="${lw*2}"/>`;
  s+=`<rect x="${cx-14}" y="${cy}" width="28" height="8" fill="${ac}"/><text x="${cx}" y="${cy+4}" fill="#fff" font-size="3.6" font-weight="700" text-anchor="middle" dominant-baseline="central">${esc(ch.data.champion||'優勝')}</text>`;
  s+=`<text x="${cx}" y="${fy+5}" font-size="3" text-anchor="middle" font-weight="700" fill="${ac}">決勝</text>`;
  if(ch.data.numbers&&labs[mno])s+=`<text x="${cx}" y="${fy+9}" font-size="2.3" text-anchor="middle" fill="${ac}">${esc(labs[mno])}</text>`;
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="${th.bf}, sans-serif">${s}</svg>`;
  return [rec(pg,ch,'bracket')];
}

/* ========== paginate whole booklet ========== */
function buildChapter(ch){
  const pre=ch.opener&&!['cover','backcover','toc','image','blank'].includes(ch.type)?buildOpener(ch):[];
  const f={cover:c=>buildCover(c,false),backcover:c=>buildCover(c,true),toc:c=>buildToc(c,S._tocEntries||[]),text:buildText,officers:buildOfficers,
    teamlist:buildTeamList,teams:buildTeams,draw:buildDraw,schedule:buildSchedule,bracket:buildBracket,sponsors:buildSponsors,image:buildImage,blank:buildBlank}[ch.type];
  return pre.concat(f?f(ch):[]);
}
function folioOf(i){const first=S.p.chapters[0];const off=(first&&first.type==='cover'&&!S.p.meta.countCover)?1:0;return i+1-off;}
function paginate(){
  const st=stage();st.innerHTML='';
  S._nums=chapterNumbers();S._tocEntries=[];
  let all=[],starts={};
  const run=()=>{st.innerHTML='';all=[];starts={};
    S.p.chapters.forEach(ch=>{starts[ch.id]=all.length;all=all.concat(buildChapter(ch));});};
  run();
  // TOC entries need page numbers → second pass
  if(S.p.chapters.some(c=>c.type==='toc')){
    for(let pass=0;pass<2;pass++){
      S._tocEntries=S.p.chapters.filter(c=>c.inToc&&!NOTOC.includes(c.type)).map(c=>({n:S._nums[c.id],title:c.title,page:folioOf(starts[c.id])}));
      const before=all.length;run();if(all.length===before)break;}
  }
  // decorate: folio, running head, thumb tabs, parity
  const th=theme();const nums=S._nums;const tabN=Math.max(nums._count,1);const paper=PAPER[S.p.meta.paper];
  const tabH=Math.min(18,(paper.h-50)/tabN);
  all.forEach((r,i)=>{const el=r.el;const recto=i%2===0;el.classList.add(recto?'recto':'verso');
    const trim=$('.trim',el);const f=folioOf(i);r.folioNo=f;
    if(r.folio&&f>0){trim.insertAdjacentHTML('beforeend',`<div class="folio">${th.base==='official'?'－ '+f+' －':String(f).padStart(2,'0')}</div>`);
      if(th.base==='pro'){trim.insertAdjacentHTML('beforeend',`<div class="rh"><span>${esc(S.p.meta.title)}</span><span>${esc(r.ch.title)}</span></div>`);
        const n=nums[r.ch.id];if(n)trim.insertAdjacentHTML('beforeend',`<div class="thumbtab" style="top:${25+(n-1)*tabH}mm;height:${tabH-1}mm">${n}</div>`);}}
  });
  S.pages=all.map(r=>({chId:r.ch.id,kind:r.kind,folio:r.folioNo,overflow:!!r.overflow,cls:r.el.className,style:r.el.getAttribute('style'),
    bleed:$('.bleedlayer',r.el).innerHTML,trim:$('.trim',r.el).innerHTML}));
  S.chapStart=starts;st.innerHTML='';
}
function assemble(p,b=0){
  const paper=PAPER[S.p.meta.paper];
  const style=p.style.replace(/--b:[^;]*;/,`--b:${b}mm;`).replace(/width:[^;]*;height:[^;]*$/,'')+`;width:${paper.w+2*b}mm;height:${paper.h+2*b}mm`;
  return `<div class="${p.cls}" style="${style}"><div class="bleedlayer">${p.bleed}</div><div class="trim">${p.trim}</div></div>`;
}

<script>
'use strict';

/* ========== issues ========== */
function computeIssues(){

  if(n>p.meta.limit)I.push({lv:'e',msg:`ページ数が上限（${p.meta.limit}）を超えています：${n}ページ`,go:'settings'});

async function pdfToDataURL(file,maxPx){
  if(!window.pdfjsLib)throw new Error('PDF読込機能を利用できません');
  pdfjsLib.GlobalWorkerOptions.workerSrc='/pdfjs-3.11.174.worker.min.js';
  const buf=await file.arrayBuffer();const doc=await pdfjsLib.getDocument({data:buf}).promise;const pg=await doc.getPage(1);
  const v1=pg.getViewport({scale:1});const sc=maxPx/Math.max(v1.width,v1.height);const vp=pg.getViewport({scale:sc});
  const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
  await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;return c.toDataURL('image/jpeg',.95);
}
async function imageToDataURL(file,maxPx,keepAlpha){
  if(/pdf$/i.test(file.type)||/\.pdf$/i.test(file.name))return pdfToDataURL(file,maxPx);
  const url=URL.createObjectURL(file);
  try{const img=new Image();img.src=url;await img.decode();
    let w=img.naturalWidth||1200,h=img.naturalHeight||1200;const isSvg=/svg/.test(file.type);
    const sc=isSvg?maxPx/Math.max(w,h):Math.min(1,maxPx/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    const alpha=keepAlpha&&/png|svg|webp|gif/.test(file.type);
    if(!alpha){x.fillStyle='#fff';x.fillRect(0,0,w,h);}x.drawImage(img,0,0,w,h);
    return alpha?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.92);
  }finally{URL.revokeObjectURL(url);}
}

let _dlP=null;async function getDownloads(){if(!(window.claude&&window.claude.use))return null;if(!_dlP)_dlP=window.claude.use('downloads').catch(()=>null);return _dlP;}
const MIME={pdf:'application/pdf',json:'application/json',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'};
async function saveFile(filename,data){
  const dl=await getDownloads();
  if(!dl){// 単独で公開したとき：ブラウザのダウンロード
    try{const ext=(filename.split('.').pop()||'').toLowerCase();
      const blob=data instanceof Blob?data:new Blob([data],{type:MIME[ext]||'application/octet-stream'});
      const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),15000);return true;}
    catch(e){toast('保存できませんでした：'+(e.message||e),5000);return false;}}
  try{await dl.save({filename,data});return true;}
  catch(e){if(e&&e.code==='declined')toast('保存をキャンセルしました');else if(e&&e.code==='rate_limited')toast('保存の確認がすでに開いています。少し待ってからもう一度お試しください',4000);else toast('保存できませんでした：'+(e&&e.message||e),5000);return false;}
}

function parseTeamWorkbook(wb){
  const out=[];
  wb.SheetNames.forEach(sn=>{
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:false});
    const find=re=>{for(let r=0;r<rows.length;r++)for(let c=0;c<rows[r].length;c++){if(re.test(String(rows[r][c]).replace(/\s/g,''))){for(let k=c+1;k<rows[r].length;k++){const v=String(rows[r][k]).trim();if(v)return v;}return '';}}return null;};
    const name=find(/^チーム名/);if(!name)return;
    const t={name,pref:find(/^(都道府県|所在地|市町村)/)||'',coach:find(/^監督/)||'',region:find(/^地区/)||'',group:find(/^ブロック/)||'',players:[]};
    let hr=-1,col={};
    for(let r=0;r<rows.length&&hr<0;r++){const row=rows[r].map(x=>String(x).replace(/\s/g,''));const ni=row.findIndex(x=>/^選手名|^氏名/.test(x));
      if(ni>=0){hr=r;col.name=ni;col.num=row.findIndex(x=>/背番号/.test(x));col.grade=row.findIndex(x=>/学年/.test(x));col.cap=row.findIndex(x=>/キャプテン|主将/.test(x));}}
    if(hr>=0)for(let r=hr+1;r<rows.length;r++){const row=rows[r];const first=String(row[0]||'');if(/^※/.test(first))break;
      const nm=String(row[col.name]||'').trim(),num=col.num>=0?String(row[col.num]||'').trim():'';if(!nm&&!num)continue;
      t.players.push({num,name:nm,grade:col.grade>=0?String(row[col.grade]||'').trim():'',captain:col.cap>=0&&/[○〇◯oO✓1]/.test(String(row[col.cap]||''))});}
    out.push(t);
  });
  return out;
}
async function importTeamSheets(){
  if(!window.XLSX){toast('Excel読込機能を読み込めませんでした');return;}
  const fs=await pickFiles('.xlsx,.xls,.xlsm,.csv',true);if(!fs.length)return;
  let add=0,upd=0,skip=[];
  for(const f of fs){try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const ts=parseTeamWorkbook(wb);if(!ts.length)skip.push(f.name);
    ts.forEach(t=>{const ex=S.p.teams.find(x=>norm(x.name)===norm(t.name));
      if(ex){Object.assign(ex,{pref:t.pref||ex.pref,coach:t.coach||ex.coach,region:t.region||ex.region,group:t.group||ex.group,players:t.players.length?t.players:ex.players});upd++;}
      else{S.p.teams.push({id:uid(),comment:'',logo:null,photo:null,...t});add++;}});}catch(e){skip.push(f.name);}}
  changed({now:true});S.sel='teams';S.teamSel=null;renderEditor();renderSide();
  showDialog('チーム紹介シートを取り込みました',`<p>新規 <b>${add}</b>チーム／更新 <b>${upd}</b>チーム</p>${skip.length?`<p style="color:var(--warn)">読み取れなかったファイル：${skip.map(esc).join('、')}<br><small>「チーム名」欄と「選手名」の見出しがあるシートを読み込みます。</small></p>`:''}`);
}

let _cancel=false;
async function runExport(o){
  if(!window.jspdf||!window.html2canvas){toast('PDF書き出し機能を読み込めませんでした。再読み込みしてください',5000);return;}
  const {jsPDF}=window.jspdf;const paper=PAPER[S.p.meta.paper];const b=o.bleed?3:0,m=o.marks?10:0;
  const pw=paper.w+2*b+2*m,ph=paper.h+2*b+2*m;
  const list=S.pages.filter(p=>o.range==='all'||p.chId===S.sel);if(!list.length)return;
  _cancel=false;$('#exP').style.display='block';$('#exGo').disabled=true;$('#exPrint').disabled=true;
  $('#exCancel').textContent='中止';$('#exCancel').onclick=()=>{_cancel=true;};
  const st=stage();st.style.cssText='position:fixed;left:0;top:0;z-index:-1';
  const pdf=new jsPDF({unit:'mm',format:[pw,ph],orientation:'portrait',compress:true});
  try{await document.fonts.ready;
    for(let i=0;i<list.length;i++){
      if(_cancel)break;
      $('#exTxt').textContent=`${i+1} / ${list.length} ページを描画しています…`;$('#exBar').style.width=(i/list.length*100)+'%';
      st.innerHTML=assemble(list[i],b);const el=st.firstElementChild;await sleep(30);
      const cv=await html2canvas(el,{scale:o.dpi/96,backgroundColor:'#ffffff',logging:false,useCORS:true,scrollX:0,scrollY:0,windowWidth:el.scrollWidth,windowHeight:el.scrollHeight,ignoreElements:e=>e.classList&&e.classList.contains('ui-hint')});
      if(i>0)pdf.addPage([pw,ph],'portrait');
      pdf.addImage(cv.toDataURL('image/jpeg',o.q),'JPEG',m,m,paper.w+2*b,paper.h+2*b,undefined,'FAST');
      if(m)cropMarks(pdf,m,b,paper.w,paper.h,pw,ph);
      cv.width=cv.height=0;
    }
    st.innerHTML='';st.style.cssText='';
    if(_cancel){toast('書き出しを中止しました');closeDialog();return;}
    $('#exTxt').textContent='PDFを作成しています…';$('#exBar').style.width='100%';
    pdf.setProperties({title:S.p.meta.title,creator:'INFINEX 大会冊子メーカー'});
    const blob=pdf.output('blob');
    const name=`${safeName(S.p.meta.title)}_${o.dpi}dpi${b?'_塗り足し':''}${m?'_トンボ':''}.pdf`;
    $('#exTxt').textContent=`完成（${(blob.size/1048576).toFixed(1)}MB）。保存しています…`;
    const ok=await saveFile(name,blob);if(ok){toast('PDFを書き出しました');closeDialog();}
  }catch(e){toast('書き出しに失敗しました：'+(e.message||e),6000);}
  finally{st.innerHTML='';st.style.cssText='';const g=$('#exGo');if(g){g.disabled=false;$('#exPrint').disabled=false;const c=$('#exCancel');c.textContent='閉じる';c.onclick=closeDialog;}}
}
function cropMarks(pdf,m,b,W,H,pw,ph){
  pdf.setLineWidth(.1);pdf.setDrawColor(0,0,0);const L=(a,c,d,e)=>pdf.line(a,c,d,e);
  const tx=m+b,ty=m+b,rx=tx+W,by=ty+H;
  [ty,ty-b,by,by+b].forEach(y=>{L(1,y,m-1,y);L(pw-m+1,y,pw-1,y);});
  [tx,tx-b,rx,rx+b].forEach(x=>{L(x,1,x,m-1);L(x,ph-m+1,x,ph-1);});
  const cx=pw/2,cy=ph/2;
  [[m/2,1,m-1],[ph-m/2,ph-m+1,ph-1]].forEach(([y,y1,y2])=>{L(cx-6,y,cx+6,y);L(cx,y1,cx,y2);});
  [[m/2,1,m-1],[pw-m/2,pw-m+1,pw-1]].forEach(([x,x1,x2])=>{L(x,cy-6,x,cy+6);L(x1,cy,x2,cy);});
}

function applyInfinex(B,mode){
  const t=B.tournament||{},st=parseJ(t.settings),ol=st.outline||{};

  let added=0;

    if(!tm){tm={id:uid(),name:x.name,region:multi&&cat?cat.name:'',pref,group,coach:'',comment:'',logo:x.logo||null,photo:null,players:[]};S.p.teams.push(tm);added++;}

  const autoSchedule=()=>cats.map(c=>{const g=c.cfg,pre=multi?`${c.name} `:'';const L=[];
    if(/league/.test(g.format||'league'))L.push(`●${pre}予選リーグ：${g.groups||''}組に分かれて総当たり　${timing(g.halfMinutes,g.periods,g.halftimeMinutes)}`);
    if(/knockout/.test(g.format||'')){const k=g.koTiming&&g.koTiming.enabled?g.koTiming:g;L.push(`●${pre}トーナメント：${timing(k.halfMinutes,k.periods,k.halftimeMinutes)}`);}
    const days=(g.dayDates||[t.date]).map((d,i)=>{const s=i===0?g.startTime:((g.extraDays||[])[i-1]||{}).startTime;return `${i+1}日目 ${jpDate(d)}${s!=null?` ${hm(s)}〜`:''}`;});
    if(days.length)L.push(`●${pre}${days.join('／')}`);return L.join('\n');}).join('\n');
  const autoRanking=()=>cats.map(c=>{const g=c.cfg,pre=multi?`${c.name} `:'';const L=[];
    if(g.tiebreak&&g.tiebreak.length)L.push(`●${pre}予選リーグの順位は、${g.tiebreak.map(k=>TB_NAMES[k]||k).join(' → ')} の順で決定する。`);
    const br=(g.knockoutPlan&&g.knockoutPlan.brackets)||[];
    if(br.length)L.push(`●${pre}予選リーグの順位により、${br.map(b=>`${b.name}（${b.from===b.to?b.from:b.from+'〜'+b.to}位）`).join('・')}に分かれて対戦する。`);
    return L.join('\n');}).join('\n');
  const lines=[];const images={};
  (ol.info||[]).forEach(i=>{const v=i.auto?autoVal[i.auto]:i.value;if(v)lines.push(`【${i.label}】${String(v).replace(/\n/g,' ')}`);});
  (ol.sections||[]).forEach(sec=>{lines.push('',`## ${sec.title}`);
    if(sec.body)lines.push(...String(sec.body).split('\n'));
    if(sec.auto==='schedule'){const a=autoSchedule();if(a)lines.push(...a.split('\n'));}
    if(sec.auto==='ranking'){const a=autoRanking();if(a)lines.push(...a.split('\n'));}
    (sec.images||[]).forEach(im=>{if(assets[im.id]){images[im.id]=assets[im.id];lines.push(`![${im.caption||''}](img:${im.id}) 85`);}});});
  const chapters=[];
  chapters.push(newChapter('text',ol.title?'大会要項':'大会要項',{...src,body:lines.join('\n').replace(/\n{3,}/g,'\n\n').trim(),images}));

  // --- per category: draw / schedule / brackets ---
  cats.forEach(c=>{
    const g=c.cfg,pre=multi?`${c.name} `:'';
    const ms=(B.matches||[]).filter(x=>x.category_id===c.id);
    const cm={};ms.forEach(x=>{if(x.code)cm[x.code]=x;});
    const teamsC=(B.teams||[]).filter(x=>x.category_id===c.id).sort((a,b)=>(a.sort||0)-(b.sort||0));
    const court=i=>(g.courtNames&&g.courtNames[i])||`${String.fromCharCode(65+(i||0))}コート`;
    const courtShort=i=>(g.courtNames&&g.courtNames[i])||String.fromCharCode(65+(i||0));
    const short=x=>x?String(x.label||'').replace(x.group_label||'\u0000','').trim()||x.label:'';
    const refText=(ref,within)=>{const r=parseJ(ref);
      if(r.t==='grp')return `${r.g}組${r.r}位`;
      if(r.t==='win'||r.t==='lose'){const x=cm[r.m];const lb=x?(within&&x.group_label===within?short(x):String(x.label).replace(/トーナメント/,'T')):r.m;return `${lb}の${r.t==='win'?'勝者':'敗者'}`;}
      return r.label||r.text||'';};
    const side=(x,s)=>{const id=x[s+'_team_id'];return id&&teamById[id]?teamById[id].name:refText(x[s+'_ref'],x.group_label);};
    const breaks=(g.dayBreakSlots||[]).slice().sort((a,b)=>a-b);
    const dayOf=x=>breaks.filter(b=>(x.slot||0)>=b).length;
    const dates=g.dayDates||[t.date];
    // draw
    const groups=[...new Set(teamsC.map(x=>x.group_label).filter(Boolean))].sort();
    if(groups.length){const br=(g.knockoutPlan&&g.knockoutPlan.brackets)||[];
      chapters.push(newChapter('draw',`${pre}組合せ（予選リーグ）`,{...src,cols:Math.min(4,groups.length),
        groupsText:groups.map(gl=>`## ${gl}組\n${teamsC.filter(x=>x.group_label===gl).map(x=>x.name).join('\n')}`).join('\n\n'),
        note:br.length?`各組の順位により、${br.map(b=>`${b.name}（${b.from===b.to?b.from:b.from+'〜'+b.to}位）`).join('・')}に進みます。`:''}));}
    // schedule per day, per court
    const nDays=Math.max(1,...ms.map(x=>dayOf(x)+1));
    for(let d=0;d<nDays;d++){
      const dm=ms.filter(x=>dayOf(x)===d);if(!dm.length)continue;
      const courts=[...new Set(dm.map(x=>x.court||0))].sort((a,b)=>a-b);
      const body=courts.map(ci=>{const cmz=dm.filter(x=>(x.court||0)===ci).sort((a,b)=>(a.start_min-b.start_min)||(a.slot-b.slot));
        const hasL=cmz.some(x=>x.stage==='league'),hasK=cmz.some(x=>x.stage!=='league');const k=g.koTiming&&g.koTiming.enabled?g.koTiming:g;
        const info=[hasL?`予選 ${timing(g.halfMinutes,g.periods,g.halftimeMinutes).replace(/（.*）/,'')}`:'',hasK?`トーナメント ${timing(k.halfMinutes,k.periods,k.halftimeMinutes).replace(/（.*）/,'')}`:''].filter(Boolean).join('・');
        return `## ${court(ci)} | ${jpDate(dates[d]||'')} | ${info}\n`+cmz.map(x=>[String(x.label||'').replace(/トーナメント/,'T'),hm(x.start_min),side(x,'home'),side(x,'away'),'',''].map(v=>String(v).replace(/,/g,'、')).join(',')).join('\n');}).join('\n');
      chapters.push(newChapter('schedule',`${pre}試合日程 ${nDays>1?`${d+1}日目（${jpDate(dates[d]||'',false)}）`:''}`.trim(),{...src,body,notes:''}));
    }
    // brackets
    const bgroups=[...new Set(ms.filter(x=>x.stage!=='league').map(x=>x.group_label).filter(Boolean))];
    const order=((g.knockoutPlan&&g.knockoutPlan.brackets)||[]).map(b=>b.name);
    bgroups.sort((a,b)=>((order.indexOf(a)+1)||99)-((order.indexOf(b)+1)||99));
    bgroups.forEach(gl=>{
      const gms=ms.filter(x=>x.stage!=='league'&&x.group_label===gl);
      const winRef=new Set();gms.forEach(x=>['home_ref','away_ref'].forEach(k=>{const r=parseJ(x[k]);if(r.t==='win')winRef.add(r.m);}));
      const node=(x,dep=0)=>({m:x,kids:['home','away'].map(s=>{const r=parseJ(x[s+'_ref']);
        if(r.t==='win'&&cm[r.m]&&dep<8)return node(cm[r.m],dep+1);return {leaf:true,text:side(x,s)};})});
      const leaves=n=>n.leaf?[n]:leaves(n.kids[0]).concat(leaves(n.kids[1]));
      let best=null;gms.filter(x=>!winRef.has(x.code)).forEach(x=>{const n=node(x),c=leaves(n).length;if(!best||c>best.c||(c===best.c&&x.place_w===1))best={n,c};});
      if(!best)return;
      const inTree=new Set();const walk=n=>{if(n.leaf)return;inTree.add(n.m.id);n.kids.forEach(walk);};walk(best.n);
      const lab=x=>`${hm(x.start_min)} ${courtShort(x.court)}`;
      const depthOK=(n,dep,want)=>n.leaf?dep===want:depthOK(n.kids[0],dep+1,want)&&depthOK(n.kids[1],dep+1,want);
      const ents=leaves(best.n).map(l=>l.text);
      let labels='';
      const isPow=ents.length>=2&&(ents.length&(ents.length-1))===0;const R=Math.log2(ents.length)-1;
      if(isPow&&depthOK(best.n,0,R+1)){const out=[];
        [best.n.kids[0],best.n.kids[1]].forEach(sideRoot=>{for(let k=1;k<=R;k++){let lvl=[sideRoot];for(let dd=0;dd<R-k;dd++)lvl=lvl.flatMap(n=>n.kids);lvl.forEach(n=>out.push(lab(n.m)));}});
        out.push(lab(best.n.m));labels=out.join('\n');}
      const extra=gms.filter(x=>!inTree.has(x.id)).sort((a,b)=>(dayOf(a)-dayOf(b))||(a.start_min-b.start_min)||(a.court-b.court));
      const note=extra.map(x=>`${short(x)}　${hm(x.start_min)} ${court(x.court)}　${side(x,'home')} − ${side(x,'away')}`).join('\n');
      chapters.push(newChapter('bracket',`${pre}${gl}`,{...src,entries:ents.join('\n'),labels,note,numbers:true,champion:'優勝'}));
    });
  });

  // --- sponsors ---
  if(sponsors.length)chapters.push(newChapter('sponsors','協賛',{...src,tiers:[{id:uid(),name:'協賛',size:'M',items:sponsors.map(s=>({id:uid(),name:s.name,logo:s.image||null}))}]}));

  // --- place chapters ---
  if(mode==='new'){
    S.p.chapters=[newChapter('cover'),newChapter('toc'),...chapters.filter(c=>c.type!=='sponsors'),newChapter('teams'),...chapters.filter(c=>c.type==='sponsors'),newChapter('backcover')];
  }else{
    const a=S.p.chapters;const first=a.findIndex(c=>c.data&&c.data.src==='infinex');
    const rest=a.filter(c=>!(c.data&&c.data.src==='infinex'));
    let at=first>=0?a.slice(0,first).filter(c=>!(c.data&&c.data.src==='infinex')).length:rest.findIndex(c=>['teams','sponsors','backcover'].includes(c.type));
    if(at<0)at=rest.length;rest.splice(at,0,...chapters);S.p.chapters=rest;
  }
  S.sel='settings';S.teamSel=null;changed({now:true});renderEditor();
  if(mode==='new')commitNewProject();
  const nm=chapters.reduce((o,c)=>(o[c.type]=(o[c.type]||0)+1,o),{});
  showDialog(mode==='new'?'大会速報のデータから冊子を作りました':'大会速報のデータで更新しました',
   `<p style="font-size:13px"><b>${esc(t.name)}</b></p>
   <p style="font-size:13px">大会要項／組合せ ${nm.draw||0}／試合日程 ${nm.schedule||0}／トーナメント表 ${nm.bracket||0}／スポンサー ${sponsors.length}社<br>チーム ${(B.teams||[]).length}（新規 ${added}・ロゴ ${(B.teams||[]).filter(x=>x.logo).length}）</p>
   <p style="font-size:13px">次の作業：チーム紹介シート（Excel）で選手名簿を取り込み、表紙・裏表紙のデザインを登録してください。</p>`,
   `<button class="btn" data-close>閉じる</button><button class="btn pri" id="ixTeams">選手名簿を取り込む</button>`);
  $('#ixTeams').onclick=()=>{closeDialog();importTeamSheets();};
}
</script>
<script>
'use strict';
/* ========== 保存先：クラウド（Cloudflare D1＋KV）／ブラウザ内（試用版） ========== */
const CLOUD={on:false,name:''};
Object.assign(S,{pid:null,rev:0,ver:0,dirty:false,syncing:false,syncAgain:false,conflict:false,updatedAt:''});
let _syncT=null,_retryT=null;

async function api(method,path,{body,headers={},raw}={}){
  const h={'x-requested-with':'infinex-booklet',...headers};let b=body;
  if(body!==undefined&&!raw){h['content-type']='application/json';b=JSON.stringify(body);}
  const r=await fetch(path,{method,headers:h,body:b,credentials:'same-origin',cache:'no-store'});
  if(r.status===401&&path!=='/api/login'){const e=new Error('ログインが必要です');e.status=401;throw e;}
  return r;
}
async function apiJson(method,path,opt){
  const r=await api(method,path,opt);const j=await r.json().catch(()=>({}));
  if(!r.ok&&r.status!==409){const e=new Error(j.error||`エラーが発生しました（${r.status}）`);e.status=r.status;throw e;}
  return {status:r.status,data:j};
}
const fmtTime=iso=>{if(!iso)return '';const d=new Date(iso);const p=n=>String(n).padStart(2,'0');return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${p(d.getMinutes())}`;};

/* ---- 保存状態の表示 ---- */
function setSync(st,extra){
  const el=$('#sync');if(!el)return;el.className='sync '+st;
  el.textContent={saved:`保存済み${extra?' '+fmtTime(extra):''}`,saving:'保存中…',pending:'未保存の変更あり',offline:'オフライン（この端末に一時保存）',error:'保存できません',login:'ログインが必要です',loading:'読み込み中…',conflict:'別の端末で更新あり'}[st]||'';
  el.title=st==='offline'?'通信が戻ると自動で保存します。押すと今すぐ保存を試します。':st==='error'?(extra||''):'押すと今すぐ保存します';
}

/* ---- ブラウザ内の保存（クラウド時は一時保存） ---- */
async function persistLocal(){
  if(!CLOUD.on){const ok=await DB.set('project',S.p);if(!ok&&!persistLocal._w){persistLocal._w=true;toast('ブラウザに保存できませんでした。こまめに「バックアップ保存」してください',5000);}return;}
  if(S.pid)await DB.set('draft:'+S.pid,{rev:S.rev,dirty:S.dirty,at:Date.now(),data:S.p});
}
function scheduleSync(ms=1500){
  if(!CLOUD.on||!S.pid||S.conflict)return;
  setSync('pending');clearTimeout(_syncT);_syncT=setTimeout(()=>syncNow(),ms);
}

/* ---- 画像をクラウドへ（data: のまま残っている画像を見つけてアップロードし、URLに置き換える） ---- */
const hex=buf=>[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
async function toUploadable(blob){
  if(/^image\/(png|jpeg|webp|gif)$/.test(blob.type))return blob;
  const url=URL.createObjectURL(blob);try{const im=new Image();im.src=url;await im.decode();const c=document.createElement('canvas');c.width=im.naturalWidth||1000;c.height=im.naturalHeight||1000;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/png'));}finally{URL.revokeObjectURL(url);}
}
async function externalize(pid){
  const found=new Map();
  (function walk(o){if(!o||typeof o!=='object')return;for(const k of Object.keys(o)){const v=o[k];
    if(typeof v==='string'){if(v.startsWith('data:image/')){if(!found.has(v))found.set(v,[]);found.get(v).push([o,k]);}}else if(v&&typeof v==='object')walk(v);}})(S.p);
  if(!found.size)return 0;
  const items=[];
  for(const [url,refs] of found){const blob=await toUploadable(await (await fetch(url)).blob());items.push({url,refs,blob,hash:hex(await crypto.subtle.digest('SHA-256',await blob.arrayBuffer()))});}
  const {data}=await apiJson('POST',`/api/projects/${pid}/assets/sync`,{body:{hashes:items.map(i=>i.hash)}});
  const miss=new Set(data.missing||[]);let n=0;
  for(const it of items){
    if(miss.has(it.hash)){setSync('saving');const el=$('#sync');if(el)el.textContent=`画像を保存中… ${++n}/${miss.size}`;
      const r=await api('PUT',`/api/projects/${pid}/assets/${it.hash}`,{raw:true,body:it.blob,headers:{'content-type':it.blob.type}});
      if(!r.ok){const j=await r.json().catch(()=>({}));const e=new Error(j.error||'画像を保存できませんでした');e.status=r.status;throw e;}}
    const u='/api/assets/'+it.hash;it.refs.forEach(([o,k])=>{if(o[k]===it.url)o[k]=u;});
  }
  return items.length;
}

/* ---- クラウドへ保存 ---- */
async function syncNow(force){
  if(!CLOUD.on||!S.pid||S.conflict)return;
  if(S.syncing){S.syncAgain=true;return;}
  if(!S.dirty&&!force)return;
  clearTimeout(_syncT);clearTimeout(_retryT);
  S.syncing=true;setSync('saving');
  const pid=S.pid,ver=S.ver;let again=false;
  try{
    await externalize(pid);
    if(pid!==S.pid)return;
    const r=await api('PUT',`/api/projects/${pid}`,{raw:true,body:JSON.stringify(S.p),headers:{'content-type':'application/json','x-base-rev':String(S.rev),'x-name':encodeURIComponent(S.p.meta.title||''),...(force==='overwrite'?{'x-force':'1'}:{})}});
    const j=await r.json().catch(()=>({}));
    if(r.status===409){S.conflict=true;setSync('conflict');onConflict(pid,j);return;}
    if(!r.ok){const e=new Error(j.error||`保存できませんでした（${r.status}）`);e.status=r.status;throw e;}
    if(pid!==S.pid)return;
    S.rev=j.rev;S.updatedAt=j.updated_at;if(S.ver===ver)S.dirty=false;else again=true;
    await DB.set('draft:'+pid,{rev:S.rev,dirty:S.dirty,at:Date.now(),data:S.p});
    setSync(S.dirty?'pending':'saved',j.updated_at);
  }catch(e){
    if(e.status===401){setSync('login');showLogin(true);}
    else if(e.status){setSync('error',e.message);toast(e.message,6000);}
    else{setSync('offline');_retryT=setTimeout(()=>syncNow(true),20000);}
  }finally{
    S.syncing=false;
    if((S.syncAgain||again)&&!S.conflict){S.syncAgain=false;scheduleSync(600);}
  }
}
async function flushCurrent(){
  if(!CLOUD.on||!S.pid||!S.dirty||S.conflict)return;
  await syncNow(true);let g=0;while(S.syncing&&g++<200)await sleep(100);
}
function onConflict(pid,j){
  showDialog('別の端末で更新されています',`<p style="font-size:13px">この冊子は、${esc(j.updated_by||'別の端末')}が ${esc(fmtTime(j.updated_at))} に更新しています。この端末の変更と、どちらを残すか選んでください。</p>
    <p style="font-size:12px;color:var(--muted)">「最新の内容を開く」を選ぶと、この端末でまだ保存されていない変更は破棄されます。迷ったときは、先に「バックアップ保存」でこの端末の内容をファイルに残せます。</p>`,
    `<button class="btn" id="cfBk">この端末の内容をファイルに保存</button><button class="btn" id="cfOver">この端末の内容で上書き</button><button class="btn pri" id="cfLoad">最新の内容を開く</button>`);
  $('#cfBk').onclick=()=>exportBackup();
  $('#cfOver').onclick=async()=>{closeDialog();S.conflict=false;await syncNow('overwrite');};
  $('#cfLoad').onclick=async()=>{closeDialog();S.conflict=false;S.dirty=false;await openProject(pid,{discardLocal:true});};
}

/* ---- 新しい冊子 ---- */
function beginNewProject(){if(!CLOUD.on)return;clearTimeout(_syncT);clearTimeout(_retryT);S.pid=null;S.rev=0;S.conflict=false;}
async function commitNewProject(){
  if(!CLOUD.on)return;
  try{const {data}=await apiJson('POST','/api/projects',{body:{name:S.p.meta.title||''}});
    S.pid=data.id;S.rev=data.rev;S.dirty=true;setHash(S.pid);hideHome();await syncNow(true);}
  catch(e){if(e.status===401)showLogin(true);else{toast('冊子を作れませんでした：'+e.message,6000);}}
}

/* ---- 冊子を開く ---- */
function setHash(id){try{history.replaceState(null,'',id?`#b=${id}`:location.pathname);}catch(e){}}
function normalizeProject(p){
  if(!p||!p.meta||!Array.isArray(p.chapters)){const n=newProject({});n.meta.title='新しい冊子';return n;}
  p.themes=p.themes||[];p.teams=p.teams||[];return p;
}
async function openProject(id,opt={}){
  if(S.pid&&S.pid!==id)await flushCurrent();
  setSync('loading');let r;
  try{r=await api('GET',`/api/projects/${id}`);}
  catch(e){if(e.status===401)return showLogin();
    const d=await DB.get('draft:'+id);
    if(d){S.pid=id;S.rev=d.rev;S.p=normalizeProject(d.data);S.dirty=!!d.dirty;S.sel='settings';S.teamSel=null;refresh();renderEditor();hideHome();setHash(id);setSync('offline');_retryT=setTimeout(()=>syncNow(true),20000);toast('通信できないため、この端末に一時保存した内容を開きました',5000);return;}
    toast('冊子を開けませんでした。通信を確認してください',5000);return showHome();}
  if(r.status===404){toast('この冊子は見つかりません（削除された可能性があります）',5000);setHash(null);return showHome();}
  const text=await r.text();const rev=+r.headers.get('x-rev');const at=r.headers.get('x-updated-at');const by=decodeURIComponent(r.headers.get('x-updated-by')||'');
  let data;try{data=JSON.parse(text);}catch(e){data=null;}
  const d=opt.discardLocal?null:await DB.get('draft:'+id);
  const load=(p,rv,dirty)=>{S.pid=id;S.rev=rv;S.p=normalizeProject(p);S.dirty=dirty;S.conflict=false;S.updatedAt=at;S.sel='settings';S.teamSel=null;refresh();renderEditor();hideHome();setHash(id);
    if(dirty)scheduleSync(300);else setSync('saved',at);};
  if(d&&d.dirty&&d.data){
    if(d.rev===rev){load(d.data,rev,true);toast('この端末で保存されていなかった変更を保存します');}
    else{load(data,rev,false);
      showDialog('保存されていない変更があります',`<p style="font-size:13px">この端末には、${esc(fmtTime(new Date(d.at).toISOString()))} に編集してクラウドに保存できなかった変更があります。その後、${esc(by||'別の端末')}が ${esc(fmtTime(at))} に更新しています。</p><p style="font-size:13px">今はクラウドの最新の内容を表示しています。</p>`,
        `<button class="btn" id="dfUse">この端末の変更で上書き</button><button class="btn pri" data-close>最新の内容を使う</button>`);
      $('#dfUse').onclick=async()=>{closeDialog();S.p=normalizeProject(d.data);S.dirty=true;refresh();renderEditor();await syncNow('overwrite');};
      DB.set('draft:'+id,{rev,dirty:false,at:Date.now(),data:S.p});}
  }else load(data,rev,false);
  // 使っていない画像の整理（1日以上前のもの）
  const used=[...new Set((text.match(/\/api\/assets\/[0-9a-f]{64}/g)||[]).map(s=>s.slice(12)))];
  if(!S.dirty)apiJson('POST',`/api/projects/${id}/assets/gc`,{body:{used}}).catch(()=>{});
}

/* ---- 別の端末の更新を取り込む（画面に戻ったとき・定期的に） ---- */
async function checkRemote(){
  if(!CLOUD.on||!S.pid||S.dirty||S.syncing||S.conflict||document.hidden||$('#modal').classList.contains('open'))return;
  try{const {data}=await apiJson('GET',`/api/projects/${S.pid}/meta`);
    if(data.rev>S.rev&&!S.dirty&&!S.syncing){const sel=S.sel,tsel=S.teamSel;await openProject(S.pid,{discardLocal:true});
      if(S.p.chapters.some(c=>c.id===sel)||sel==='settings'||sel==='teams'){S.sel=sel;S.teamSel=tsel;renderSide();renderEditor();renderPreview();}
      toast(`${data.updated_by||'別の端末'}の変更を読み込みました`);}}
  catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkRemote();else if(S.dirty)syncNow(true);});
window.addEventListener('online',()=>{if(S.dirty)syncNow(true);});
window.addEventListener('pagehide',()=>{if(CLOUD.on&&S.dirty)persistLocal();});
setInterval(checkRemote,45000);

/* ---- バックアップ（画像も1つのファイルに入れる） ---- */
async function inlineAssets(obj){
  const cache=new Map();
  const toData=async u=>{if(cache.has(u))return cache.get(u);const b=await (await fetch(u,{credentials:'same-origin'})).blob();
    const d=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b);});cache.set(u,d);return d;};
  async function walk(o){if(!o||typeof o!=='object')return;for(const k of Object.keys(o)){const v=o[k];
    if(typeof v==='string'&&v.startsWith('/api/assets/'))o[k]=await toData(v);else if(v&&typeof v==='object')await walk(v);}}
  await walk(obj);return obj;
}
async function exportBackup(){
  try{toast('バックアップを作っています…');const data=CLOUD.on?await inlineAssets(clone(S.p)):S.p;
    const ok=await saveFile(`${safeName(S.p.meta.title)}_冊子バックアップ.json`,JSON.stringify(data));if(ok)toast('バックアップを保存しました');}
  catch(e){toast('バックアップを作れませんでした：'+(e.message||e),5000);}
}
$('#btnSave').onclick=exportBackup;

/* ---- ログイン ---- */
let _afterLogin=null;
function showLogin(resume){
  _afterLogin=resume?'resume':'route';
  const nm=(()=>{try{return localStorage.getItem('ib_name')||'';}catch(e){return '';}})();
  const dlg=$('#dlg');
  dlg.innerHTML=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><img src="${$('.mark img')?$('.mark img').src:''}" alt="" width="28" height="25" style="background:#0A0C0B;padding:5px;border-radius:6px;box-sizing:content-box"><b style="font-family:Archivo,sans-serif;letter-spacing:.18em">INFINEX</b><span style="color:var(--muted);font-size:13px">冊子</span></div>
  <h2>ログイン</h2><p style="color:var(--muted);font-size:13px;margin:4px 0 14px">${resume?'ログインの有効期限が切れました。もう一度ログインすると、編集中の内容を保存します。':'冊子のデータはクラウドに保存され、スマホとパソコンのどちらからでも編集できます。'}</p>
  <label class="fld"><span>パスワード</span><input type="password" id="lgPw" autocomplete="current-password"></label>
  <label class="fld"><span>あなたの名前（更新した人として表示されます）</span><input type="text" id="lgNm" autocomplete="name" placeholder="例：山田（スマホ）" value="${esc(nm)}"></label>
  <div id="lgErr" style="color:var(--err);font-size:13px;min-height:18px"></div>
  <div class="acts"><button class="btn pri" id="lgGo">ログイン</button></div>`;
  $('#modal').classList.add('open');setTimeout(()=>$('#lgPw').focus(),50);
  const go=async()=>{const pw=$('#lgPw').value,name=$('#lgNm').value.trim();if(!pw){$('#lgErr').textContent='パスワードを入力してください';return;}
    $('#lgGo').disabled=true;
    try{const r=await api('POST','/api/login',{body:{password:pw,name}});const j=await r.json().catch(()=>({}));
      if(!r.ok){$('#lgErr').textContent=j.error||'ログインできませんでした';return;}
      try{localStorage.setItem('ib_name',name);}catch(e){}CLOUD.name=j.name;closeDialog();renderWho();
      if(_afterLogin==='resume'){if(S.pid)syncNow(true);}else routeFromHash();}
    catch(e){$('#lgErr').textContent='通信できませんでした。電波の良い場所でもう一度お試しください';}
    finally{const b=$('#lgGo');if(b)b.disabled=false;}};
  $('#lgGo').onclick=go;$('#lgPw').onkeydown=e=>{if(e.key==='Enter')go();};$('#lgNm').onkeydown=e=>{if(e.key==='Enter')go();};
}

/* ---- 冊子一覧 ---- */
function renderWho(){const w=$('#homeWho');if(w)w.textContent=CLOUD.name?`${CLOUD.name} でログイン中`:'ログイン中';}
function hideHome(){$('#home').classList.remove('open');}
async function showHome(){
  if(S.pid&&S.dirty)await flushCurrent();
  const h=$('#home');h.classList.add('open');setHash(null);
  const box=$('#homeList');box.innerHTML='<p class="lead">読み込み中…</p>';
  let list=[];try{list=(await apiJson('GET','/api/projects')).data.projects||[];}
  catch(e){if(e.status===401){hideHome();return showLogin();}box.innerHTML=`<p class="lead">一覧を読み込めませんでした。通信を確認して、もう一度開いてください。</p>`;return;}
  const legacy=await DB.get('project');
  $('#homeBanner').innerHTML=legacy&&legacy.meta&&!legacy._migrated?`<div class="banner"><span>このブラウザに、クラウド保存の前に作った冊子「${esc(legacy.meta.title)}」が残っています。クラウドに移すと、スマホからも編集できます。</span><button class="btn sm" id="hmMig">クラウドに移す</button></div>`:'';
  const mg=$('#hmMig');if(mg)mg.onclick=async()=>{beginNewProject();S.p=normalizeProject(legacy);S.sel='settings';refresh();renderEditor();await commitNewProject();legacy._migrated=true;await DB.set('project',legacy);toast('クラウドに移しました');};
  box.innerHTML=list.length?`<div class="plist">${list.map(p=>`<div class="pcard"><div class="tt"><b data-open="${p.id}">${esc(p.name||'（名前なし）')}</b><small>更新 ${esc(fmtTime(p.updated_at))}${p.updated_by?`（${esc(p.updated_by)}）`:''}</small></div><div class="bt"><button class="btn sm pri" data-open="${p.id}" style="background:var(--brand);color:var(--brand-ink);border-color:var(--brand)">開く</button><button class="btn sm" data-dup="${p.id}">複製</button><button class="btn sm danger" data-del="${p.id}" data-nm="${esc(p.name)}">削除</button></div></div>`).join('')}</div>`
    :'<p class="lead">まだ冊子がありません。「新しい冊子を作る」か「大会速報のバックアップから作る」で始めてください。</p>';
}
function buildHome(){
  const h=document.createElement('div');h.id='home';h.className='home';
  h.innerHTML=`<div class="home-bar"><div class="mark"><img src="${$('.mark img').src}" alt="" width="22" height="20"><b>INFINEX</b><span>冊子</span></div><span class="who" id="homeWho"></span><button class="btn sm" id="hmOut">ログアウト</button></div>
  <div class="home-in"><h1>冊子一覧</h1><p class="lead">冊子はクラウドに保存されます。スマホとパソコンのどちらからでも、同じ冊子を開いて続きを編集できます。</p>
  <div class="acts"><button class="btn pri" id="hmNew">新しい冊子を作る</button><button class="btn" id="hmIx">大会速報のバックアップから作る</button><button class="btn" id="hmBk">冊子のバックアップを開く</button></div>
  <div id="homeBanner"></div><div id="homeList"></div></div>`;
  document.body.append(h);renderWho();
  $('#hmOut').onclick=async()=>{if(S.dirty)await flushCurrent();await api('POST','/api/logout').catch(()=>{});location.hash='';location.reload();};
  $('#hmNew').onclick=()=>showWizard();
  $('#hmBk').onclick=()=>openJson();
  $('#hmIx').onclick=async()=>{const [f]=await pickFiles('.json',false);if(!f)return;let j;try{j=JSON.parse(await f.text());}catch(e){toast('JSONとして読めないファイルです');return;}
    if(!j||j.format!=='infinex-backup'){toast('INFINEX大会速報のバックアップではありません',4000);return;}
    beginNewProject();S.p=newProject({});S.p.chapters=[];importInfinexBackup(j,{fresh:true});};
  $('#homeList').addEventListener('click',async e=>{
    const o=e.target.closest('[data-open]');if(o){openProject(o.dataset.open);return;}
    const d=e.target.closest('[data-dup]');if(d){try{await apiJson('POST',`/api/projects/${d.dataset.dup}/duplicate`);toast('複製しました');showHome();}catch(er){toast(er.message,5000);}return;}
    const x=e.target.closest('[data-del]');if(x){if(!confirm(`「${x.dataset.nm}」を削除しますか？\n削除すると元に戻せません。必要なら先に冊子を開いて「バックアップ保存」してください。`))return;
      try{await apiJson('DELETE',`/api/projects/${x.dataset.del}`);await DB.set('draft:'+x.dataset.del,null);if(S.pid===x.dataset.del){S.pid=null;}toast('削除しました');showHome();}catch(er){toast(er.message,5000);}}
  });
}
function setupCloudChrome(){
  const mark=$('.top .mark');
  mark.insertAdjacentHTML('afterend','<button class="btn" id="btnHome" title="冊子一覧に戻る">一覧</button>');
  $('#meter').insertAdjacentHTML('beforebegin','<button class="sync" id="sync" type="button"></button>');
  $('#btnHome').onclick=()=>showHome();
  $('#sync').onclick=()=>{if(S.conflict)return;S.dirty=true;syncNow(true);};
  buildHome();
}
function routeFromHash(){const m=location.hash.match(/^#b=([0-9a-z]+)/);if(m)openProject(m[1]);else showHome();}
window.addEventListener('hashchange',()=>{if(!CLOUD.on)return;const m=location.hash.match(/^#b=([0-9a-z]+)/);if(m&&m[1]!==S.pid)openProject(m[1]);});

/* ========== 起動 ========== */
(async function boot(){
  await DB.open();
  let probe=null;
  if(/^https?:$/.test(location.protocol)){
    try{const r=await fetch('/api/me',{credentials:'same-origin',cache:'no-store'});
      if((r.headers.get('content-type')||'').includes('json'))probe={status:r.status,data:await r.json().catch(()=>({}))};}catch(e){}
  }
  let t;document.fonts&&document.fonts.addEventListener('loadingdone',()=>{clearTimeout(t);t=setTimeout(()=>{if(S.p)refresh();},250);});
  if(!probe){ // 試用版（claude.ai 上など）：ブラウザ内に保存
    const saved=await DB.get('project');
    S.p=saved&&saved.chapters?normalizeProject(saved):sampleProject();
    refresh();renderEditor();if(!saved)showWizard();
    document.fonts&&document.fonts.ready.then(()=>refresh());return;
  }
  CLOUD.on=true;S.p=newProject({});refresh();renderEditor();setupCloudChrome();
  document.fonts&&document.fonts.ready.then(()=>{if(S.pid)refresh();});
  if(probe.status===503){showDialog('初期設定が完了していません',`<p style="font-size:13px">${esc(probe.data.error||'')}</p><p style="font-size:12px;color:var(--muted)">README の「公開の手順」を確認してください。</p>`,' ');return;}
  if(probe.status===401)return showLogin();
  CLOUD.name=probe.data.name||'';renderWho();routeFromHash();
})();
</script>
